<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us – Jalaludeen Ademosu</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css"
      integrity="sha512-z3gLpd7yknf1YoNbCzqRKc4qyor8gaKU1qmn+CShxbuBusANI9QpRohGBreCFkKxLhei6S9CQXFEbbKuqLg0DA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="main-nav" aria-label="Main navigation">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Me</a></li>
        <li><a href="contact.html" aria-current="page">Contact</a></li>
      </ul>
    </nav>

    <main class="contact-page">
      <article class="contact-container">
        <header>
          <h1>Contact Us</h1>
          <p>Have a question or want to work together? Send me a message!</p>
        </header>

        <!-- Success Message -->
        <div
          id="success-message"
          class="success-message"
          data-testid="test-contact-success"
          role="status"
          aria-live="polite"
        ></div>
        <form
          id="contact-form"
          class="contact-form"
          novalidate
          aria-label="Contact form"
        >
          <!-- Full Name -->
          <div class="form-group">
            <label for="contact-name">
              Full Name <span aria-label="required">*</span>
            </label>
            <input
              type="text"
              id="contact-name"
              name="name"
              data-testid="test-contact-name"
              aria-required="true"
              aria-describedby="error-name"
              required
            />
            <span
              id="error-name"
              class="error-message"
              data-testid="test-contact-error-name"
              role="alert"
            ></span>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="contact-email">
              Email <span aria-label="required">*</span>
            </label>
            <input
              type="email"
              id="contact-email"
              name="email"
              data-testid="test-contact-email"
              aria-required="true"
              aria-describedby="error-email"
              required
            />
            <span
              id="error-email"
              class="error-message"
              data-testid="test-contact-error-email"
              role="alert"
            ></span>
          </div>

          <!-- Subject -->
          <div class="form-group">
            <label for="contact-subject">
              Subject <span aria-label="required">*</span>
            </label>
            <input
              type="text"
              id="contact-subject"
              name="subject"
              data-testid="test-contact-subject"
              aria-required="true"
              aria-describedby="error-subject"
              required
            />
            <span
              id="error-subject"
              class="error-message"
              data-testid="test-contact-error-subject"
              role="alert"
            ></span>
          </div>

          <!-- Message -->
          <div class="form-group">
            <label for="contact-message">
              Message <span aria-label="required">*</span>
            </label>
            <textarea
              id="contact-message"
              name="message"
              data-testid="test-contact-message"
              aria-required="true"
              aria-describedby="error-message"
              rows="6"
              required
            ></textarea>
            <span
              id="error-message"
              class="error-message"
              data-testid="test-contact-error-message"
              role="alert"
            ></span>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            data-testid="test-contact-submit"
            class="submit-btn"
          >
            Send Message
          </button>

          <!-- Success Message -->
          <div
            id="success-message"
            class="success-message"
            data-testid="test-contact-success"
            role="status"
            aria-live="polite"
          ></div>
        </form>
      </article>
    </main>
    <!-- Footer -->
    <footer class="site-footer">
      <div class="footer-content">
        <div>
          <nav aria-label="Footer navigation">
            <ul class="footer-links">
              <li><a href="index.html">Home</a></li>
              <li><a href="about.html">About</a></li>
              <li><a href="contact.html">Contact</a></li>
            </ul>
          </nav>
        </div>

        <div class="footer-social" aria-label="Social media links">
          <a
            href="https://x.com/AdeyemiJalal"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Twitter"
          >
            <i class="fa-brands fa-x-twitter" aria-hidden="true"></i>
          </a>
          <a
            href="https://github.com/Jayboy2003"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
          >
            <i class="fab fa-github" aria-hidden="true"></i>
          </a>
          <a
            href="https://linkedin.com/in/jalal-adeyemi"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          >
            <i class="fab fa-linkedin" aria-hidden="true"></i>
          </a>
        </div>
      </div>

      <div class="footer-copyright">
        <p>
          &copy; 2025 <a href="index.html">Jalaludeen Ademosu</a>. All rights
          reserved. Built with passion and code.
        </p>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
